{% extends 'base.html' %}
{% load static %}
{% block content %}
    <main>
        <div class="form-container">
            <h1>To-do list</h1>
            <form method="POST" action="">
                {% csrf_token %}
                {{ form.title }}
                <button type="submit" class="form-button">ADD TASK</button>
            </form>

        </div>
        
        <div class="tasks">
            {% for task in tasks %}
                <div class="task">
                    <div class="image-and-title">
                        {% if task.done %}
                            <img src="{% static 'ticked.svg' %}">
                        {% else %}
                            <img src="{% static 'unticked.svg' %}">
                        {% endif %}
                        <p>{{ task.title }}</p>
                    </div>            
                    <div class="buttons">
                        {% if task.done %}
                            <a href="{% url 'not_done' task.id %}"><button type="submit" class="edit-button">MARK AS NOT DONE</button></a>
                        {% else %}
                            <a href="{% url 'edit' task.id %}"><button type="submit" class="edit-button">MARK AS DONE</button></a>
                        {% endif %}
                        <a href="{% url 'delete' task.id %}"><button type="submit" class="delete-button">DELETE</button></a>
                    </div>            
                </div>
            {% endfor %}

        </div>

    </main>
    
    
{% endblock %}
